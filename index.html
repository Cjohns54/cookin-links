<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connor | cookin.code</title>
  <meta name="description" content="Connor from cookin.code. Learn to make videos like mine, and learn to take vibe coded apps to production.">
  <meta name="author" content="Connor Johnson">
  <meta name="theme-color" content="#05070f">
  <link rel="icon" type="image/jpeg" href="images/avatar.jpg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Connor | cookin.code">
  <meta property="og:description" content="Learn to make videos like mine. Vibe code to production.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/links.css">
</head>
<body>
  <!-- Background layers -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--one" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--two" aria-hidden="true"></div>
  <canvas class="bg-particles" aria-hidden="true"></canvas>

  <main class="card">
    <div class="avatar-wrap">
      <img class="avatar" src="images/avatar.jpg" alt="cookin.code chef logo" width="112" height="112">
    </div>

    <h1 class="name">CONNOR</h1>
    <p class="handle">@cookin.code</p>
    <p class="tagline">Software Engineer <span>|</span> Animated Coding Videos<br>Shipping Apps to Production</p>

    <nav class="socials" aria-label="Social">
      <a href="https://www.instagram.com/cookin.code/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" ry="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.6" r="1.2" fill="currentColor"/></svg>
      </a>
    </nav>

    <p class="section-label"><span class="prompt">&gt;</span> start here<span class="cursor">_</span></p>

    <nav class="links" aria-label="Links">
      <!-- To add a link: copy one <a class="link"> line, change the href and the text -->
      <a class="link" href="https://forms.gle/NW2ybdv6MHg2rpNN6" target="_blank" rel="noopener">Learn to make videos like mine</a>
      <!-- TODO: replace # with your Skool community URL -->
      <a class="link" href="#" target="_blank" rel="noopener">Vibe code to production</a>
    </nav>
  </main>

  <script>
    // Slow drifting code glyphs in the background
    (function () {
      var c = document.querySelector('.bg-particles');
      if (!c || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var ctx = c.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 2);
      var glyphs = ['</>', '{ }', '=>', '01', '()', '[]', ';', '#', '&&', 'fn'];
      var items = [];
      function size() {
        c.width = innerWidth * dpr; c.height = innerHeight * dpr;
        c.style.width = innerWidth + 'px'; c.style.height = innerHeight + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function make() {
        items = [];
        var n = Math.round(innerWidth * innerHeight / 22000);
        for (var i = 0; i < n; i++) items.push({
          x: Math.random() * innerWidth, y: Math.random() * innerHeight,
          v: 0.12 + Math.random() * 0.3, a: 0.06 + Math.random() * 0.16,
          s: 11 + Math.random() * 8, g: glyphs[i % glyphs.length]
        });
      }
      function tick() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        for (var i = 0; i < items.length; i++) {
          var p = items[i];
          p.y -= p.v; if (p.y < -20) { p.y = innerHeight + 20; p.x = Math.random() * innerWidth; }
          ctx.font = '500 ' + p.s + 'px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(120,180,255,' + p.a + ')';
          ctx.fillText(p.g, p.x, p.y);
        }
        requestAnimationFrame(tick);
      }
      size(); make(); tick();
      addEventListener('resize', function () { size(); make(); });
    })();
  </script>
</body>
</html>
